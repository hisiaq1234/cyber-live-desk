# CYBER LIVE DESK — the external pinger for Crid's brain.
#
# The desk deploys on Vercel's free plan, which only accepts cron schedules of once per day.
# Once a day is not a life: it is one gesture every 24 hours. So the tick is driven from
# here instead — GitHub's scheduler calls the deployed endpoint every five minutes, which is
# the shortest interval GitHub Actions supports (anything faster is silently rounded up to 5).
#
# What it needs, set in the repository's Settings → Secrets and variables → Actions:
#   DESK_URL      (variable) the deployed desk origin, e.g. https://your-project.vercel.app
#   CRON_SECRET   (secret)   the same value as CRON_SECRET in the Vercel project
#
# The endpoint accepts `Authorization: Bearer $CRON_SECRET` and answers with what the tick
# did, so a failing run here is a real signal rather than a silent no-op.
name: brain-tick

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

# Two ticks must never overlap: the engine's session is read, advanced and written back, so a
# second run landing mid-write would lose a step or replay one.
concurrency:
  group: brain-tick
  cancel-in-progress: false

permissions: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Step the brain once
        env:
          DESK_URL: ${{ vars.DESK_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$DESK_URL" ]; then
            echo "::error::DESK_URL repository variable is not set — nothing to call."
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret is not set — the desk will answer 401."
            exit 1
          fi

          url="${DESK_URL%/}/api/brain-tick"
          echo "POSTing $url"

          # --fail-with-body: a 4xx/5xx marks the run red, but the body is still printed so the
          # reason (401 vs 500) is visible without re-running by hand.
          body=$(curl -sS --fail-with-body --max-time 30 \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Accept: application/json" \
            "$url")

          echo "response: $body"
