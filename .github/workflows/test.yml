# CYBER LIVE DESK — test suite on every push and pull request.
#
# Build the checked-in CRID source assets before running the whole Node contract.
# The avatar ladder and per-stage cutout rigs are generated from the pinned r7
# reference, so tests must never compare stale generated files.
name: test

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install Pillow
      - name: Generate the canonical body ladder and all stage rigs
        run: |
          python scripts/build-body-ladder.py
          python scripts/build-crid-rig.py --all --check
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
