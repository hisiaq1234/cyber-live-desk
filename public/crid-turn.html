<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crid 360 — keyed turn sprites</title>
<style>
  html,body{margin:0;background:#14101f;color:#f4f0ff;font:13px/1.4 ui-monospace,Menlo,monospace}
  h1{font-size:15px;padding:14px 18px 4px;margin:0}
  .sub{padding:0 18px 14px;color:#9d92c0;font-size:12px}
  .stage{padding:10px 18px;border-top:1px solid #2a2340}
  .stage b{color:#86f6bc}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  figure{margin:0;text-align:center}
  img{height:340px;display:block;background:
    repeating-conic-gradient(#241d38 0% 25%,#1b1529 0% 50%) 0 0/24px 24px}
  figcaption{font-size:10px;color:#8f84b8;padding-top:4px}
</style>
</head>
<body>
<h1>CRID 360 — keyed sprites</h1>
<div class="sub">docs/reference/crid-360.zip → public/desk-assets/crid/turn/&lt;stage&gt;/angle-N.webp · angle-8 = front · black keyed to alpha</div>
<div id="app"></div>
<script>
const STAGES=[["base","k=1.00"],["body-3","k=0.82"],["body-0","k=0.95"],["body-4","k=0.95"],["body-5","k=1.10"],["body-1","k=1.03"],["body-11","k=1.13"],["body-2","k=1.28"]];
const ANGLES={1:"3/4 L",2:"side L",3:"rear 3/4",4:"back",5:"rear 3/4 R",6:"side R",7:"3/4 R",8:"FRONT"};
const app=document.getElementById("app");
for(const[stage,k]of STAGES){
  const d=document.createElement("div");d.className="stage";
  d.innerHTML=`<b>${stage}</b> <span style="color:#8f84b8">${k}</span>`;
  const row=document.createElement("div");row.className="row";
  for(let a=1;a<=8;a++){
    const f=document.createElement("figure");
    f.innerHTML=`<img loading="lazy" src="./desk-assets/crid/turn/${stage}/angle-${a}.webp" alt="${stage} angle-${a}"><figcaption>angle-${a} · ${ANGLES[a]}</figcaption>`;
    row.append(f);
  }
  d.append(row);app.append(d);
}
</script>
</body>
</html>
