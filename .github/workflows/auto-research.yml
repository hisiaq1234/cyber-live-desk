# CYBER LIVE DESK — the external pinger for scheduled auto-research.
#
# Same reason as brain-tick.yml: the desk deploys on Vercel's free plan, which only accepts
# cron schedules of once per day, so the 15-minute research run documented in
# api/desk-auto-research.mjs cannot be a Vercel cron. GitHub's scheduler calls the deployed
# endpoint every 15 minutes instead.
#
# The endpoint answers 401 without the bearer and skips cheaply while "Auto research" is
# off in the controller, so this schedule is safe to leave running.
#
# What it needs, set in the repository's Settings → Secrets and variables → Actions
# (the same two the brain-tick workflow already uses):
#   DESK_URL      (variable) the deployed desk origin, e.g. https://your-project.vercel.app
#   CRON_SECRET   (secret)   the same value as CRON_SECRET in the Vercel project
name: auto-research

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

# Research reads the queue, adds cards and writes state back — two runs must never overlap.
concurrency:
  group: auto-research
  cancel-in-progress: false

permissions: {}

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run scheduled research once
        env:
          DESK_URL: ${{ vars.DESK_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$DESK_URL" ]; then
            echo "::error::DESK_URL repository variable is not set — nothing to call."
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret is not set — the desk will answer 401."
            exit 1
          fi

          url="${DESK_URL%/}/api/desk-auto-research"
          echo "GET $url"

          # --fail-with-body: a 4xx/5xx marks the run red, but the body is still printed so the
          # reason (401 vs 500) is visible without re-running by hand.
          body=$(curl -sS --fail-with-body --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Accept: application/json" \
            "$url")

          echo "response: $body"
