name: Build CRID body ladder

on:
  workflow_dispatch:
  push:
    branches:
      - fix/crid-physical-mobility
    paths:
      - public/desk-assets/crid-bot.js
      - public/desk-assets/crid-3d.js
      - public/desk-assets/physics.mjs
      - scripts/build-body-ladder.py
      - scripts/build-crid-rig.py
      - scripts/probe-crid.mjs
      - .github/workflows/build-crid-ladder.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install image tooling
        run: python -m pip install --upgrade Pillow
      - name: Fetch the approved face recipe at rotation zero
        run: python scripts/build-body-ladder.py --fetch
      - name: Build and measure all seven silhouettes
        run: python scripts/build-body-ladder.py
      - name: Rebuild all per-stage cutout rigs
        run: |
          python scripts/build-crid-rig.py --all --check
      - name: Run the full JavaScript regression suite
        run: |
          npm ci
          npm test
      - name: Install Chrome for CRID visual probes
        uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - name: Capture CRID at phone, compact and desktop sizes
        run: |
          export CHROME_BIN="$(command -v google-chrome)"
          PROBE_SIZE=390x844 PROBE_NAME=phone node scripts/probe-crid.mjs
          PROBE_SIZE=1024x768 PROBE_NAME=compact node scripts/probe-crid.mjs
          PROBE_SIZE=1920x1080 PROBE_NAME=desktop PROBE_CLIMB=1 node scripts/probe-crid.mjs
      - name: Upload CRID visual probes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crid-visual-probes
          path: outputs/crid-lab-*.png
          if-no-files-found: warn
      - name: Create comparison sheet
        run: python scripts/build-body-ladder.py --sheet out/crid-body-ladder.png
      - name: Upload generated visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: crid-body-ladder
          path: |
            out/crid-body-ladder.png
            views/body-000-r7.webp
            public/crid-lab.html
            public/desk-assets/
            public/desk-assets/crid/ladder.json
            public/desk-assets/crid/ladder.mjs
      - name: Commit generated assets after verification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add views/body-*-r0.png views/body-000-r7.webp public/desk-assets/crid/body-*-r0.webp public/desk-assets/crid/ladder.json public/desk-assets/crid/ladder.mjs public/desk-assets/crid/rigs public/desk-assets/crid/rig.mjs
          if ! git diff --cached --quiet; then
            git commit -m "Build consistent CRID body ladder and rigs"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "Generated ladder is already current."
          fi
